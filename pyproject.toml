[project]
name = "resenas-negocio-local"
version = "0.1.0"
description = "API Inteligente para reseñas de un negocio local con FastAPI, SQLite y Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "google-generativeai>=0.4.0",
    "python-dotenv>=1.0.0",
]